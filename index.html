      }
    }

    function closePaymentModal() {
      activePaymentModal = null;
      render();
    }

    function confirmUniversalPaymentSuccess() {
      if (!activePaymentModal) return;
      const db = getDB();
      const fee = activePaymentModal.amount;
      const tax = fee * 0.18;
      const net = fee - tax;

      if (activePaymentModal.type === 'FIXTURE_LOCK') {
        const item = db.fixtures.find(f => f.id === activePaymentModal.id);
        if (item) item.status = 'USED';
      } else if (activePaymentModal.type === 'LEGAL_PACK') {
        db.startupPacks.unshift({
          id: 'STP-' + Date.now().toString().slice(-4),
          business: activePaymentModal.business,
          entity: activePaymentModal.entity,
          loanScheme: activePaymentModal.loanScheme,
          loanAmt: activePaymentModal.loanAmt,
          status: 'SUBMITTED_TO_BANK'
        });
      }

      db.ledger.unshift({
        id: 'TXN-' + Date.now().toString().slice(-4),
        source: activePaymentModal.description,
        gross: fee,
        tax: Number(tax.toFixed(2)),
        net: Number(net.toFixed(2)),
        status: 'DIRECT_SBI_CREDITED',
        date: new Date().toISOString().slice(0, 10)
      });

      saveDB(db);
      
      const modal = activePaymentModal;
      activePaymentModal = null;
      alert(`Payment Verified! ₹ ${net.toFixed(2)} net fee direct aapke SBI A/c (${MASTER_CONFIG.accountNo} - ISM Dhanbad) me credit ho gayi hai.`);
      
      if (modal.type === 'SEARCH_GATEWAY') {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(modal.query)}`, '_blank');
      } else if (modal.type === 'APP_GATEWAY') {
        window.open(modal.targetUrl, '_blank');
      } else if (modal.type === 'DOC_DOWNLOAD') {
        alert(`Certified Legal Pack PDF download unlocked for: ${modal.business}`);
      }
      
      render();
    }

    function openAddFixturePrompt() {
      if (currentUser.role !== 'OWNER') return alert('Only Master Owner can add fixtures.');
      const title = prompt("Fixture / Project Title:");
      if (!title) return;
      const cat = prompt("Category (Residential / Hotel / Commercial):", "Commercial Interior");
      const client = prompt("Client Name:", "Eastern Developers");
      const city = prompt("City / Location:", "Dhanbad");
      const budget = prompt("Budget (e.g. ₹ 20,00,000):", "₹ 20,00,000");
      const rawBudget = Number((budget || '').replace(/[^0-9]/g, '')) || 2000000;
      const lockFee = Math.round(rawBudget * 0.01);

      const db = getDB();
      db.fixtures.unshift({
        id: 'FIX-' + Date.now().toString().slice(-4),
        title,
        cat: cat || 'General Setup',
        client: client || 'Enterprise',
        city: city || 'India',
        budget: budget || '₹ 0',
        rawBudget,
        lockFee,
        status: 'OPEN',
        date: new Date().toISOString().slice(0, 10)
      });
      saveDB(db);
      alert('Naya Fixture OPEN status aur 1% Owner Lock Fee ke sath add ho gaya!');
      render();
    }

    function sendOwnerMessage() {
      if (currentUser.role !== 'OWNER') return alert('Only Master Owner can post broadcasts.');
      const msgInput = document.getElementById('chat-msg');
      const text = msgInput.value;
      if (!text) return;

      const db = getDB();
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      db.worldChat.unshift({
        id: 'MSG-' + Date.now(),
        sender: 'Suraj Kumar Mishra (Master Owner)',
        text: text,
        time: timeStr,
        tag: 'OWNER_COMMAND'
      });

      saveDB(db);
      msgInput.value = '';
      render();
    }

    function instantBankWithdraw(amount) {
      alert(`Withdrawal Authorized!\n₹ ${amount.toLocaleString()} settled to Owner Bank Account:\nSBI A/c: ${MASTER_CONFIG.accountNo}\nBranch: ${MASTER_CONFIG.branch}\nUPI: ${MASTER_CONFIG.upiId}\nPayee: Suraj Kumar Mishra`);
    }

    function addPro() {
      if (currentUser.role !== 'OWNER') return alert('Only Master Owner can add professionals.');
      const cat = document.getElementById('a-cat').value;
      const name = document.getElementById('a-name').value;
      const city = document.getElementById('a-city').value;
      const phone = document.getElementById('a-phone').value;
      if (!name || !city || !phone) return alert('Please fill in all fields.');

      const db = getDB();
      db.directory.unshift({ id: 'DIR-' + Date.now(), cat, name, city, phone, country: 'IN', fee: 999 });
      saveDB(db);
      alert(name + ' added to directory successfully!');
      tab('dir');
    }

    render();
  </script>
</body>
</html>
