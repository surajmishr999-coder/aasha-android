    function setFixtureStateWithEarnings(id, targetState) {
      if (currentUser.role !== 'OWNER') return alert('Access Denied. Only Master Owner can change deal state.');
      const db = getDB();
      const item = db.fixtures.find(f => f.id === id);
      if (!item) return;

      if (!item.claimedStages) item.claimedStages = [];
      const alreadyClaimed = item.claimedStages.includes(targetState);

      item.status = targetState;

      if (!alreadyClaimed) {
        const fee = item.lockFee || Math.round(item.rawBudget * 0.01);
        const tax = fee * 0.18;
        const net = fee - tax;

        item.claimedStages.push(targetState);

        db.ledger.unshift({
          id: 'TXN-' + Date.now().toString().slice(-4),
          source: `${targetState}_STAGE_PAYOUT (${item.title})`,
          gross: fee,
          tax: Number(tax.toFixed(2)),
          net: Number(net.toFixed(2)),
          status: 'DIRECT_SBI_CREDITED',
          date: new Date().toISOString().slice(0, 10)
        });

        saveDB(db);
        alert(`State Changed to [${targetState}]!\n₹ ${net.toFixed(2)} Net Stage Profit direct aapke Earnings Vault aur SBI A/c (${MASTER_CONFIG.accountNo}) me credit ho gaya hai.`);
      } else {
        saveDB(db);
        alert(`State updated to [${targetState}]. (Stage earnings pehle hi securely claim ho chuki hain).`);
      }

      render();
    }

    function approveIncomingFeed(id) {
      if (currentUser.role !== 'OWNER') return;
      const db = getDB();
      const index = db.pendingApprovals.findIndex(p => p.id === id);
      if (index !== -1) {
        const item = db.pendingApprovals[index];
        db.directory.unshift({
          id: 'DIR-' + Date.now().toString().slice(-4),
          name: item.name,
          cat: item.type,
          city: item.city,
          phone: item.contact,
          fee: item.fee || 999,
          rating: '5.0 ★'
        });
        db.pendingApprovals.splice(index, 1);
        saveDB(db);
        alert(`Approved! "${item.name}" is now live in Global Directory with direct owner monetization.`);
        render();
      }
    }

      if (currentUser.role !== 'OWNER') return;

      db.pendingApprovals = db.pendingApprovals.filter(p => p.id !== id);

      if (!activePaymentModal) return;

      const net = fee - tax;

      if (activePaymentModal.type === 'FIXTURE_LOCK') {
        const item = db.fixtures.find(f => f.id === activePaymentModal.id);
        if (item) {
          item.status = 'USED';
          if (!item.claimedStages) item.claimedStages = [];
          if (!item.claimedStages.includes('OPEN')) item.claimedStages.push('OPEN');

          docType: activePaymentModal.docType,

        gross: fee,
        tax: Number(tax.toFixed(2)),
        net: Number(net.toFixed(2)),

      saveDB(db);
