    function creditVault(amount, source) {
      const db = getDB();
      const fee = Number(amount);
      const tax = fee * 0.18;
      const net = fee - tax;
      db.ledger.unshift({
        id: 'TXN-' + Date.now().toString().slice(-4),
        source: source,
        gross: fee,
        tax: Number(tax.toFixed(2)),
        net: Number(net.toFixed(2)),
        status: 'DIRECT_SBI_CREDITED',
        date: new Date().toISOString().slice(0, 10)
      });
      saveDB(db);
      alert(`${source} added! Net profit ₹${net.toFixed(2)} credited to SBI Vault.`);
      render();
    }

    function setFixtureStateWithEarnings(id, targetState) {
      if (currentUser.role !== 'OWNER') return alert('Access Denied. Only Master Owner can change deal state.');
      const db = getDB();
      const item = db.fixtures.find(f => f.id === id);
      if (!item) return;

      if (!item.claimedStages) item.claimedStages = [];
      const alreadyClaimed = item.claimedStages.includes(targetState);
      item.status = targetState;

      if (!alreadyClaimed) {
        const fee = item.lockFee || Math.round(item.rawBudget * 0.01);
        const tax = fee * 0.18;
        const net = fee - tax;
        item.claimedStages.push(targetState);

        db.ledger.unshift({
          id: 'TXN-' + Date.now().toString().slice(-4),
          source: `${targetState}_STAGE_PAYOUT (${item.title})`,
          gross: fee,
          tax: Number(tax.toFixed(2)),
          net: Number(net.toFixed(2)),
          status: 'DIRECT_SBI_CREDITED',
          date: new Date().toISOString().slice(0, 10)
        });

        saveDB(db);
        alert(`State Changed to [${targetState}]!\n₹ ${net.toFixed(2)} Net Stage Profit direct aapke SBI A/c (${MASTER_CONFIG.accountNo}) me credit ho gaya hai.`);
      } else {
        saveDB(db);
        alert(`State updated to [${targetState}].`);
      }
      render();
    }

    }

      alert(`Sovereign Withdrawal Authorized!\n₹ ${amount.toLocaleString()} has been settled to Owner Bank Account:\nSBI A/c: ${MASTER_CONFIG.accountNo}\nBranch: ${MASTER_CONFIG.branch}\nUPI: ${MASTER_CONFIG.upiId}\nPayee: Suraj Kumar Mishra`);
    }

    function closePaymentModal() { activePaymentModal = null; render(); }

    function confirmUniversalPaymentSuccess() {
      if (!activePaymentModal) return;
      const db = getDB();
      const fee = activePaymentModal.amount;
      const tax = fee * 0.18;
      const net = fee - tax;

      if (activePaymentModal.type === 'FIXTURE_LOCK') {
        const item = db.fixtures.find(f => f.id === activePaymentModal.id);
        if (item) {
          item.status = 'USED';
          if (!item.claimedStages) item.claimedStages = [];
          if (!item.claimedStages.includes('OPEN')) item.claimedStages.push('OPEN');
        }
      }

      db.ledger.unshift({
        id: 'TXN-' + Date.now().toString().slice(-4),
        source: activePaymentModal.description,
        gross: fee,
        tax: Number(tax.toFixed(2)),
        net: Number(net.toFixed(2)),
        status: 'DIRECT_SBI_CREDITED',
        date: new Date().toISOString().slice(0, 10)
      });

      saveDB(db);
      const modal = activePaymentModal;
      activePaymentModal = null;
      alert(`Payment Verified! ₹ ${net.toFixed(2)} net profit direct aapke SBI A/c (${MASTER_CONFIG.accountNo}) me credit ho gayi hai.`);
      if (modal.type === 'SEARCH_GATEWAY') window.open(`https://www.google.com/search?q=${encodeURIComponent(modal.query)}`, '_blank');
      render();
    }

    function triggerSelfHealingCheck() { document.getElementById('self-heal-modal').classList.remove('hidden'); }
    function applySafePatch() {
      document.getElementById('self-heal-modal').classList.add('hidden');
      alert("AI Safe-Patch Applied! Zero runtime errors & memory refreshed.");
    }

    render();
  </script>
</body>
</html>
