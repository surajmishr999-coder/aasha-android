    function doLogin() {
      const e = document.getElementById('l-email').value;
      const p = document.getElementById('l-pass').value;
      const db = getDB();
      const user = db.users.find(u => u.email === e && u.pass === p);
      if (user) {
        currentUser = user;
        activeTab = 'fixtures';
        render();
      } else {
        alert('Invalid email or password');
      }
    }

    function logout() { currentUser = null; render(); }
    function tab(t) { activeTab = t; render(); }
    function setCategoryFilter(c) { filterCategory = c; render(); }

    function setFixtureStatus(id, newStatus) {
      if (currentUser.role !== 'OWNER') return alert('Access Denied. Only Master Owner can change deal status.');
      const db = getDB();
      const item = db.fixtures.find(f => f.id === id);
      if (item) {
        const oldStatus = item.status;
        item.status = newStatus;

        if (newStatus === 'CLOSED' && oldStatus !== 'CLOSED') {
          const grossFee = item.lockFee || Math.round(item.rawBudget * 0.01);
          const tax = grossFee * 0.18;
          const net = grossFee - tax;

          db.ledger.unshift({
            id: 'TXN-' + Date.now().toString().slice(-4),
            source: `CLOSED_DEAL_PAYOUT (${item.title})`,
            gross: grossFee,
            tax: Number(tax.toFixed(2)),
            net: Number(net.toFixed(2)),
            status: 'DIRECT_SBI_CREDITED',
            date: new Date().toISOString().slice(0, 10)
          });

          alert(`Mega Deal "${item.title}" Closed!\n₹ ${net.toFixed(2)} Net Payout direct aapke Earnings Vault aur SBI Account (${MASTER_CONFIG.accountNo}) me credit ho gaya hai.`);
        }

        saveDB(db);
        render();
      }
    }

      } else {
        activePaymentModal = {
          type: 'APP_GATEWAY',
          appName,
          targetUrl: url,
          amount: fee,
          description: `Direct Connect Gateway: ${appName}`
        };
        render();
      }
    }

    function triggerDownloadDoc(title) {
      if (currentUser.role === 'OWNER') {
        alert(`Downloading Certified Legal & CMA Project PDF for: ${title}`);
      } else {
        activePaymentModal = {
          type: 'DOC_DOWNLOAD',
          title,
          amount: 499,
          description: `Certified Bank CMA PDF Download: ${title}`
        };
        render();
      }
    }

    function closePaymentModal() {
      activePaymentModal = null;
      render();
    }

    function confirmUniversalPaymentSuccess() {
      if (!activePaymentModal) return;
      const db = getDB();
      const fee = activePaymentModal.amount;
      const tax = fee * 0.18;
      const net = fee - tax;

      if (activePaymentModal.type === 'FIXTURE_LOCK') {
        const item = db.fixtures.find(f => f.id === activePaymentModal.id);
        if (item) item.status = 'USED';
      } else if (activePaymentModal.type === 'LEGAL_DEED_PACK') {
        db.legalDocs.unshift({
          id: 'DOC-' + Date.now().toString().slice(-4),
          title: activePaymentModal.name,
          docType: activePaymentModal.docType,
          loanScheme: activePaymentModal.loanScheme,
          status: 'CERTIFIED_ISSUED'
        });
      }

      db.ledger.unshift({
        id: 'TXN-' + Date.now().toString().slice(-4),
        source: activePaymentModal.description,
        gross: fee,
        tax: Number(tax.toFixed(2)),
        net: Number(net.toFixed(2)),
        status: 'DIRECT_SBI_CREDITED',
        date: new Date().toISOString().slice(0, 10)
      });

      saveDB(db);
      const modal = activePaymentModal;
      activePaymentModal = null;
      alert(`Payment Verified! ₹ ${net.toFixed(2)} net profit direct aapke SBI A/c (${MASTER_CONFIG.accountNo} - ISM Dhanbad) me credit ho gayi hai.`);
      
      if (modal.type === 'SEARCH_GATEWAY') {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(modal.query)}`, '_blank');
      } else if (modal.type === 'APP_GATEWAY') {
        window.open(modal.targetUrl, '_blank');
      } else if (modal.type === 'DOC_DOWNLOAD') {
        alert(`Certified Legal Pack PDF download unlocked for: ${modal.title}`);
      }

      render();
    }

    function openAddMegaDealPrompt() {
      if (currentUser.role !== 'OWNER') return alert('Only Master Owner can add mega deals.');
      const title = prompt("Mega Deal / Event Title (e.g. Royal Rajputana Mandap / Luxury Penthouse Interior):");
      if (!title) return;
      const cat = prompt("Category (WEDDING_EVENT / INTERIOR_DESIGN / HOTEL_HOSPITALITY / FOOD_MANUFACTURER / TOUR_AIRLINE):", "WEDDING_EVENT");
      const client = prompt("Client / Enterprise Name:", "Grand Heritage Enterprises");
      const city = prompt("City / Location:", "Dhanbad / Delhi");
      const budget = prompt("Package Budget (e.g. ₹ 50,00,000):", "₹ 50,00,000");
      const details = prompt("Deal Scope & Specs:", "Complete Turnkey Execution & Premium World-Class Standards");
      const rawBudget = Number((budget || '').replace(/[^0-9]/g, '')) || 5000000;
      const lockFee = Math.round(rawBudget * 0.01);

      const db = getDB();
      db.fixtures.unshift({
        id: 'FIX-' + Date.now().toString().slice(-4),
        title,
        cat: cat || 'WEDDING_EVENT',
        client: client || 'Enterprise',
        city: city || 'India',
        budget: budget || '₹ 0',
        details: details || 'Full Turnkey Execution',
        rawBudget,
        lockFee,
        status: 'OPEN',
        date: new Date().toISOString().slice(0, 10)
      });
      saveDB(db);
      alert('Naya Mega Deal successfully Launch ho gaya!');
      render();
    }

    function openAddProPrompt() {
      if (currentUser.role !== 'OWNER') return alert('Only Master Owner can add professionals.');
      const name = prompt("Enterprise / Guild Name (e.g. Imperial Banquets / ArchForm Interiors):");
      if (!name) return;
      const cat = prompt("Category (WEDDING_HALL / INTERIOR_DESIGNER / HOTEL_RESORT / FOOD_FACTORY / AIR_TRAVEL):", "WEDDING_HALL");
      const city = prompt("City / Region:", "Dhanbad");
      const phone = prompt("Phone / WhatsApp:", "+91 98765 43210");

      const db = getDB();
      db.directory.unshift({
        id: 'DIR-' + Date.now().toString().slice(-4),
        name,
        cat: cat || 'WEDDING_HALL',
        city: city || 'India',
        phone: phone || '+91 00000 00000',
        fee: 999,
        rating: '5.0 ★'
      });
      saveDB(db);
      alert(name + ' verified directory me jud chuka hai!');
      render();
    }

    function sendOwnerMessage() {
      if (currentUser.role !== 'OWNER') return alert('Only Master Owner can post broadcasts.');
      const msgInput = document.getElementById('chat-msg');
      const text = msgInput.value;
      if (!text) return;

      const db = getDB();
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

      db.worldChat.unshift({
        id: 'MSG-' + Date.now(),
        sender: 'Suraj Kumar Mishra (Master Owner)',
        text: text,
        time: timeStr,
        tag: 'OWNER_COMMAND'
      });

      saveDB(db);
      msgInput.value = '';
      render();
    }

    function instantBankWithdraw(amount) {
      alert(`Sovereign Withdrawal Authorized!\n₹ ${amount.toLocaleString()} has been settled to Owner Bank Account:\nSBI A/c: ${MASTER_CONFIG.accountNo}\nBranch: ${MASTER_CONFIG.branch}\nUPI: ${MASTER_CONFIG.upiId}\nPayee: Suraj Kumar Mishra`);
    }

    render();
  </script>
</body>
