    function loadDynamicForm(docId) {
      const fixture = documentEngineSchema.fixtures[currentDocFixtureKey];

      const fields = [...documentEngineSchema.commonFields, ...doc.fields];

    async function generateAuditGradePDF(fixtureName, docTitle, data) {
      const printWindow = window.open("", "_blank");
      const issuedTimestamp = new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" });
      const docRef = data.doc_number || "AWS-" + Date.now().toString().slice(-8);
      const cleanGst = (data.tax_id || "").trim().toUpperCase();

      const rawPayload = `${docRef}|${cleanGst}|${issuedTimestamp}|AASHA_WORLD_OS`;
      const msgBuffer = new TextEncoder().encode(rawPayload);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const docHash = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');

      const verificationUrl = cleanGst ? `https://services.gst.gov.in/services/searchtp?gstin=${cleanGst}` : `https://mca.gov.in`;
      const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(verificationUrl)}`;

      let dynamicRows = "";
      for (const [k, v] of Object.entries(data)) {
        if (!["party_name", "date", "doc_number", "tax_id", "contact"].includes(k) && v) {
          dynamicRows += `<tr><td style="padding:8px;border:1px solid #cbd5e1;background:#f8fafc;font-weight:600;">${k.replace(/_/g," ").toUpperCase()}</td><td style="padding:8px;border:1px solid #cbd5e1;">${v}</td></tr>`;
        }
      }

      printWindow.document.write(`
      <!DOCTYPE html><html><head><title>${docTitle}</title><style>body{font-family:sans-serif;margin:20px;color:#0f172a;}table{width:100%;border-collapse:collapse;margin:15px 0;}th,td{border:1px solid #cbd5e1;padding:8px;font-size:12px;}</style></head><body>
      <div style="border:2px solid #0f172a;padding:20px;">
        <div style="display:flex;justify-content:space-between;border-bottom:2px solid #0f172a;padding-bottom:10px;">
          <div><h2>AASHA WORLD-OS</h2><p>${fixtureName.toUpperCase()} INFRASTRUCTURE</p></div>
          <div style="text-align:right;"><img src="${qrCodeUrl}" width="70" height="70"><br><small>REF: ${docRef}</small></div>
        </div>
        <h3 style="text-align:center;margin:15px 0;">${docTitle}</h3>
        <p><strong>Party:</strong> ${data.party_name} | <strong>Contact:</strong> ${data.contact}</p>
        <table><tbody>${dynamicRows}</tbody></table>
        <div style="font-family:monospace;font-size:9px;color:#64748b;margin-top:15px;">SHA-256 CHECKSUM: ${docHash}</div>
      </div>
      <script>window.onload=function(){window.print();}<\/script></body></html>`);
      printWindow.document.close();
    }

    function triggerDeviceAutoLocator() {
      if (!navigator.geolocation) return alert("Geolocation not supported by browser.");
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude, longitude } = pos.coords;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
          const data = await res.json();
          document.getElementById('worldSearchResultsBox').innerText = `Locked: ${data.display_name} (${latitude.toFixed(4)}, ${longitude.toFixed(4)})`;
          triggerAudioNotification("Live Device GPS Locked");
        } catch(e) {
          document.getElementById('worldSearchResultsBox').innerText = `Locked Coords: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
        }
      });
    }

    function calcSplits() {
      const db = getDB();
      const selId = document.getElementById('vbHotel')?.value;
      const hotel = db.hotelInventory.find(h => h.id === selId) || db.hotelInventory[0];
      const base = hotel ? hotel.baseRate : 0;
      let addonPrice = 0;
      if (document.getElementById('addDJ')?.checked) addonPrice += 25000;
      if (document.getElementById('addDecor')?.checked) addonPrice += 45000;
      if (document.getElementById('addPhoto')?.checked) addonPrice += 40000;
      if (document.getElementById('addCab')?.checked) addonPrice += 18000;

      const markup = Math.round(base * 0.15);
      const gross = base + markup + addonPrice + 299;
      const qEl = document.getElementById('quoteGross');
      if (qEl) qEl.innerText = `₹${gross.toLocaleString()}`;
    }
